name: Release TaiYangShenDian v1.4.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM Windows cross-toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          command -v clang-cl
          command -v lld-link
          clang-cl --version
          lld-link --version

      - name: Compile Windows x86 DLL
        shell: bash
        run: bash build/build.sh

      - name: Validate PE and exports
        shell: bash
        run: |
          set -euo pipefail
          test -s taiyangshendian.dll
          file taiyangshendian.dll
          llvm-readobj --file-headers --coff-exports taiyangshendian.dll
          sha256sum taiyangshendian.dll > taiyangshendian.dll.sha256
          cat taiyangshendian.dll.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
# TaiYangShenDian v1.4.0

适用于 **Turtle WoW / WoW 1.12.x Windows x86**。

## 版本信息

- DLL Version: `1.4.0-AURA6D4-R4-CAST1R2-LFX1-ARX1-DW1-LOS1`
- API Version: `33`
- Build: `20261016-v140-api33-mov-world-native-v2`
- Platform: Windows x86
- Lua: WoW Lua 5.0
- Movement World Recovery: Native GameUI Hook
- 基线：`52604754`
- 正式合入 `main`：`77737065`

## 核心 API

### Core
```
TaiYangShenDian("Core.Version")
TaiYangShenDian("Core.Status")
```

### Movement
```
TaiYangShenDian("Movement.Pause")
TaiYangShenDian("Movement.Resume")
TaiYangShenDian("Movement.IsPaused")
```

功能：

- `Movement.Pause()` — 暂停当前移动
- `Movement.Resume()` — 按当前实际按键状态恢复移动
- `Movement.IsPaused()` — 查询暂停状态
- 支持按住 W/A/S/D 时暂停与恢复
- 支持切地图后恢复持续按键移动
- 支持小退重新登录后恢复持续按键移动

Movement World Recovery 使用 WoW 1.12 客户端原生 GameUI World 生命周期入口：
```
World Enter: 0x004908C0
World Leave: 0x00490A80
```

