## Movement 实机验证

本版本的 Movement World Recovery 已进行实际客户端验证：
```
Pause / Resume                         PASS
按住 W → Pause → Resume               PASS
切地图后保持 W → 恢复移动              PASS
小退重新登录后保持 W → 恢复移动         PASS
静止状态 Pause 不产生自动后退           PASS
```

Movement API 本次正式封版。

