name: Recovery Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'recovered/**'
      - 'recovery/archive.parts/**'
      - '.github/workflows/recovery-build.yml'

jobs:
  build-api37:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils
          CLANG_CL="$(command -v clang-cl || command -v clang-cl-18 || find /usr/lib/llvm-* -type f -name clang-cl | sort -V | tail -n1)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || find /usr/lib/llvm-* -type f -name lld-link | sort -V | tail -n1)"
          LLVM_READOBJ="$(command -v llvm-readobj || command -v llvm-readobj-18 || find /usr/lib/llvm-* -type f -name llvm-readobj | sort -V | tail -n1)"
          test -x "$CLANG_CL"
          test -x "$LLD_LINK"
          test -x "$LLVM_READOBJ"
          sudo ln -sf "$CLANG_CL" /usr/local/bin/clang-cl
          sudo ln -sf "$LLD_LINK" /usr/local/bin/lld-link
          sudo ln -sf "$LLVM_READOBJ" /usr/local/bin/llvm-readobj
          clang-cl --version
          lld-link --version
          llvm-readobj --version

      - name: Build recovered DLL
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_SH="$GITHUB_WORKSPACE/recovered/api37-s5r1f1/build/build.sh"
          test -f "$BUILD_SH"
          chmod +x "$BUILD_SH"
          bash "$BUILD_SH"
          ROOT="$(cd "$(dirname "$BUILD_SH")/.." && pwd)"
          test -f "$ROOT/taiyangshendian.dll"
          file "$ROOT/taiyangshendian.dll"
          sha256sum "$ROOT/taiyangshendian.dll" | tee /tmp/SHA256.txt
          cp "$ROOT/taiyangshendian.dll" /tmp/taiyangshendian-api37-recovered.dll

      - name: Verify PE contract
        shell: bash
        run: |
          set -euxo pipefail
          DLL=/tmp/taiyangshendian-api37-recovered.dll
          file "$DLL" | grep -E 'PE32.*Intel 80386'
          llvm-readobj --file-headers --coff-exports --coff-imports "$DLL" | tee /tmp/PE_CONTRACT.txt
          grep -F 'Load' /tmp/PE_CONTRACT.txt
          grep -F 'FirstEnterWorld' /tmp/PE_CONTRACT.txt
          grep -F 'TaiYangShenDianNativeStatus' /tmp/PE_CONTRACT.txt
          grep -F 'KERNEL32.dll' /tmp/PE_CONTRACT.txt

      - name: Verify API contract strings
        shell: bash
        run: |
          set -euxo pipefail
          DLL=/tmp/taiyangshendian-api37-recovered.dll
          for s in \
            'Foundation.Status' \
            'Cooldown.Status' 'Cooldown.Get' 'Cooldown.List' \
            'UnitState.Status' 'UnitState.Get' 'UnitState.Track' 'UnitState.Untrack' 'UnitState.List' 'UnitState.Clear' \
            'Spatial.Status' 'Spatial.Get' 'Unit.Distance' 'Unit.Behind'; do
            strings "$DLL" | grep -Fx "$s"
          done

      - name: Package recovered source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          printf '%s\n' "$GITHUB_SHA" > /tmp/SOURCE_COMMIT.txt
          zip -qr /tmp/taiyangshendian-api37-recovered-source.zip recovered/api37-s5r1f1
          test -s /tmp/taiyangshendian-api37-recovered-source.zip
          sha256sum /tmp/taiyangshendian-api37-recovered-source.zip | tee /tmp/SOURCE_SHA256.txt

      - name: Upload recovered DLL and source
        uses: actions/upload-artifact@v4
        with:
          name: taiyangshendian-api37-recovered
          path: |
            /tmp/taiyangshendian-api37-recovered.dll
            /tmp/taiyangshendian-api37-recovered-source.zip
            /tmp/SHA256.txt
            /tmp/SOURCE_SHA256.txt
            /tmp/SOURCE_COMMIT.txt
            /tmp/PE_CONTRACT.txt
