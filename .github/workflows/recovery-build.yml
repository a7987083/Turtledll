name: Recovery Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'recovered/**'
      - 'recovery/archive.parts/**'
      - '.github/workflows/recovery-build.yml'

jobs:
  build-api37:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate recovery overlay syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile recovered/api37-s5r1f1/apply_overlay.py

      - name: Install LLVM tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils
          CLANG_CL="$(command -v clang-cl || command -v clang-cl-18 || find /usr/lib/llvm-* -type f -name clang-cl | sort -V | tail -n1)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || find /usr/lib/llvm-* -type f -name lld-link | sort -V | tail -n1)"
          test -x "$CLANG_CL"
          test -x "$LLD_LINK"
          sudo ln -sf "$CLANG_CL" /usr/local/bin/clang-cl
          sudo ln -sf "$LLD_LINK" /usr/local/bin/lld-link
          clang-cl --version
          lld-link --version

      - name: Reconstruct recovery source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat recovery/archive.parts/api37-source.part*.b64 | tr -d '\r\n' | base64 -d > /tmp/api37-source.xz
          file /tmp/api37-source.xz
          mkdir -p /tmp/api37-source
          xz -dc /tmp/api37-source.xz > /tmp/api37-source.payload
          file /tmp/api37-source.payload
          if tar -tf /tmp/api37-source.payload >/dev/null 2>&1; then
            tar -xf /tmp/api37-source.payload -C /tmp/api37-source
          else
            echo 'Decoded payload is not a tar archive'
            exit 1
          fi
          find /tmp/api37-source -maxdepth 3 -type f | sort | head -200

      - name: Apply current recovered modules
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(dirname "$(find /tmp/api37-source -type f -path '*/build/build.sh' | head -n1)")/.."
          ROOT="$(cd "$ROOT" && pwd)"
          python3 recovered/api37-s5r1f1/apply_overlay.py "$ROOT"
          grep -n 'TysUnitStateCore::onWorldLeaving' "$ROOT/src/dllmain.cpp"
          grep -n 'custom_event_bridge.obj' "$ROOT/build/build.sh"

      - name: Build recovered DLL
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_SH="$(find /tmp/api37-source -type f -path '*/build/build.sh' | head -n1)"
          test -n "$BUILD_SH"
          chmod +x "$BUILD_SH"
          bash "$BUILD_SH"
          ROOT="$(cd "$(dirname "$BUILD_SH")/.." && pwd)"
          test -f "$ROOT/taiyangshendian.dll"
          file "$ROOT/taiyangshendian.dll"
          sha256sum "$ROOT/taiyangshendian.dll" | tee /tmp/SHA256.txt
          cp "$ROOT/taiyangshendian.dll" /tmp/taiyangshendian-api37-recovered.dll

      - name: Verify API contract strings
        shell: bash
        run: |
          set -euxo pipefail
          DLL=/tmp/taiyangshendian-api37-recovered.dll
          for s in \
            'Foundation.Status' \
            'Cooldown.Status' 'Cooldown.Get' 'Cooldown.List' \
            'UnitState.Status' 'UnitState.Get' 'UnitState.Track' 'UnitState.Untrack' 'UnitState.List' 'UnitState.Clear' \
            'Spatial.Status' 'Spatial.Get' 'Unit.Distance' 'Unit.Behind'; do
            strings "$DLL" | grep -Fx "$s"
          done

      - name: Upload recovered DLL
        uses: actions/upload-artifact@v4
        with:
          name: taiyangshendian-api37-recovered
          path: |
            /tmp/taiyangshendian-api37-recovered.dll
            /tmp/SHA256.txt
